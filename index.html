<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Chat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #0e1621);
    color: var(--tg-theme-text-color, #ffffff);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #header {
    padding: 14px 16px;
    background: linear-gradient(135deg, rgba(43,156,255,0.12), var(--tg-theme-secondary-bg-color, #17212b) 60%);
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
  }

  #header .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6ab3f3, #2b9cff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    overflow: hidden;
    box-shadow: 0 0 0 2px rgba(43,156,255,0.25), 0 2px 8px rgba(0,0,0,0.25);
  }

  #header .title { font-weight: 600; font-size: 16px; letter-spacing: -0.2px; }
  #header .subtitle { font-size: 12px; color: #7d8b99; display: flex; align-items: center; gap: 4px; }
  #header .subtitle::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4cd964;
    display: inline-block;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg {
    max-width: 80%;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
    animation: msgIn 0.25s ease;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #2ba0ff, #2b7fff);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg.ai {
    align-self: flex-start;
    background: var(--tg-theme-secondary-bg-color, #232e3c);
    color: var(--tg-theme-text-color, #e9edf1);
    border-bottom-left-radius: 4px;
  }

  .msg.typing {
    align-self: flex-start;
    background: var(--tg-theme-secondary-bg-color, #232e3c);
    padding: 12px 16px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    display: flex;
    gap: 4px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7d8b99;
    animation: blink 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  #inputBar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--tg-theme-secondary-bg-color, #17212b);
    border-top: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
  }

  #attachBtn, #genImageBtn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: #7d8b99;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }
  #attachBtn:active, #genImageBtn:active { opacity: 0.6; transform: scale(0.92); background: rgba(255,255,255,0.06); }

  #imagePreviewBar {
    display: none;
    padding: 8px 12px 0 12px;
    background: var(--tg-theme-secondary-bg-color, #17212b);
  }
  #imagePreviewBar.active { display: flex; align-items: center; gap: 8px; }
  #imagePreviewBar img {
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 8px;
  }
  #imagePreviewBar .removeImg {
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
  }

  .msg img.chatImage {
    max-width: 100%;
    border-radius: 12px;
    display: block;
    margin-bottom: 6px;
  }

  #textInput {
    flex: 1;
    border: none;
    outline: none;
    background: var(--tg-theme-bg-color, #0e1621);
    color: var(--tg-theme-text-color, #fff);
    padding: 11px 16px;
    border-radius: 22px;
    font-size: 15px;
  }

  #sendBtn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #2ba0ff, #2b7fff);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(43,156,255,0.35);
    transition: transform 0.1s;
  }

  #sendBtn:active { opacity: 0.85; transform: scale(0.92); }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
</style>
</head>
<body>

<div id="header">
  <div class="avatar">🤖</div>
  <div>
    <div class="title">AI Yordamchi</div>
    <div class="subtitle">onlayn</div>
  </div>
</div>

<div id="messages"></div>

<div id="imagePreviewBar">
  <img id="previewImg" src="" alt="">
  <button class="removeImg" id="removeImgBtn">✕</button>
</div>

<div id="inputBar">
  <button id="attachBtn" title="Rasm yuklash">📎</button>
  <button id="genImageBtn" title="Rasm yaratish">🎨</button>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
  <input type="text" id="textInput" placeholder="Xabar yozing..." autocomplete="off">
  <button id="sendBtn">➤</button>
</div>

<script>
  // ====== SOZLAMALAR ======
  const WORKER_URL = "https://bitter-band-5085.abdulzoxirbaxromovic.workers.dev";
  // =========================

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const attachBtn = document.getElementById('attachBtn');
  const genImageBtn = document.getElementById('genImageBtn');
  const fileInput = document.getElementById('fileInput');
  const imagePreviewBar = document.getElementById('imagePreviewBar');
  const previewImg = document.getElementById('previewImg');
  const removeImgBtn = document.getElementById('removeImgBtn');

  let history = [
    { role: "system", content: "Sen foydali, samimiy AI yordamchisisan. O'zbek tilida javob ber." }
  ];

  let selectedImageBase64 = null;

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    resizeImage(file, (resizedBase64) => {
      selectedImageBase64 = resizedBase64;
      previewImg.src = selectedImageBase64;
      imagePreviewBar.classList.add('active');
    });
  });

  function resizeImage(file, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxSize = 1024;
        let width = img.width;
        let height = img.height;
        if (width > height && width > maxSize) {
          height = Math.round(height * (maxSize / width));
          width = maxSize;
        } else if (height > maxSize) {
          width = Math.round(width * (maxSize / height));
          height = maxSize;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const resizedBase64 = canvas.toDataURL('image/jpeg', 0.8);
        callback(resizedBase64);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  removeImgBtn.addEventListener('click', () => {
    selectedImageBase64 = null;
    fileInput.value = '';
    imagePreviewBar.classList.remove('active');
  });

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text && !selectedImageBase64) return;

    // Foydalanuvchi xabarini chatda ko'rsatish
    const userDiv = document.createElement('div');
    userDiv.className = 'msg user';
    if (selectedImageBase64) {
      const img = document.createElement('img');
      img.src = selectedImageBase64;
      img.className = 'chatImage';
      userDiv.appendChild(img);
    }
    if (text) {
      const textNode = document.createElement('div');
      textNode.textContent = text;
      userDiv.appendChild(textNode);
    }
    messagesEl.appendChild(userDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    // AI uchun xabar tarkibini tayyorlash
    let userContent;
    if (selectedImageBase64) {
      userContent = [];
      if (text) userContent.push({ type: "text", text: text });
      userContent.push({ type: "image_url", image_url: { url: selectedImageBase64 } });
    } else {
      userContent = text;
    }
    history.push({ role: "user", content: userContent });

    inputEl.value = '';
    selectedImageBase64 = null;
    fileInput.value = '';
    imagePreviewBar.classList.remove('active');

    showTyping();

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: history
        })
      });

      const data = await response.json();
      hideTyping();

      if (data.choices && data.choices[0]) {
        const reply = data.choices[0].message.content;
        addMessage(reply, 'ai');
        history.push({ role: "assistant", content: reply });
      } else {
        const errMsg = data.error?.message || JSON.stringify(data).slice(0, 300);
        addMessage("Xatolik: " + errMsg, 'ai');
      }
    } catch (err) {
      hideTyping();
      addMessage("Tarmoq xatosi: " + err.message, 'ai');
    }
  }

  async function generateImage() {
    const prompt = inputEl.value.trim();
    if (!prompt) return;

    addMessage(prompt, 'user');
    inputEl.value = '';
    showTyping();

    const encodedPrompt = encodeURIComponent(prompt);
    const seed = Math.floor(Math.random() * 1000000);
    const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${seed}&nologo=true`;

    // Rasmni oldindan yuklab, tayyor bo'lguncha kutamiz
    const img = new Image();
    img.onload = () => {
      hideTyping();
      const div = document.createElement('div');
      div.className = 'msg ai';
      const imgEl = document.createElement('img');
      imgEl.src = imageUrl;
      imgEl.className = 'chatImage';
      div.appendChild(imgEl);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    };
    img.onerror = () => {
      hideTyping();
      addMessage("Rasm yaratishda xatolik yuz berdi. Qaytadan urinib ko'ring.", 'ai');
    };
    img.src = imageUrl;
  }

  genImageBtn.addEventListener('click', generateImage);

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  addMessage("Salom! Men AI yordamchiman. Nima haqida gaplashamiz?", 'ai');
</script>

</body>
</html>
