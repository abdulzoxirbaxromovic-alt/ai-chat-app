<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Chat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #0e1621);
    color: var(--tg-theme-text-color, #ffffff);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #header {
    padding: 14px 16px;
    background: var(--tg-theme-secondary-bg-color, #17212b);
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  #header .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6ab3f3, #2b9cff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  #header .title { font-weight: 600; font-size: 16px; }
  #header .subtitle { font-size: 12px; color: #7d8b99; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg {
    max-width: 80%;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: #2b9cff;
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg.ai {
    align-self: flex-start;
    background: var(--tg-theme-secondary-bg-color, #232e3c);
    color: var(--tg-theme-text-color, #e9edf1);
    border-bottom-left-radius: 4px;
  }

  .msg.typing {
    align-self: flex-start;
    background: var(--tg-theme-secondary-bg-color, #232e3c);
    padding: 12px 16px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    display: flex;
    gap: 4px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7d8b99;
    animation: blink 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  #inputBar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--tg-theme-secondary-bg-color, #17212b);
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  #textInput {
    flex: 1;
    border: none;
    outline: none;
    background: var(--tg-theme-bg-color, #0e1621);
    color: var(--tg-theme-text-color, #fff);
    padding: 11px 16px;
    border-radius: 22px;
    font-size: 15px;
  }

  #sendBtn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: #2b9cff;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  #sendBtn:active { opacity: 0.7; }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
</style>
</head>
<body>

<div id="header">
  <div class="avatar">🤖</div>
  <div>
    <div class="title">AI Yordamchi</div>
    <div class="subtitle">onlayn</div>
  </div>
</div>

<div id="messages"></div>

<div id="inputBar">
  <input type="text" id="textInput" placeholder="Xabar yozing..." autocomplete="off">
  <button id="sendBtn">➤</button>
</div>

<script>
  // ====== SOZLAMALAR ======
  const WORKER_URL = "https://bitter-band-5085.abdulzoxirbaxromovic.workers.dev";
  // =========================

  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');

  let history = [
    { role: "system", content: "Sen foydali, samimiy AI yordamchisisan. O'zbek tilida javob ber." }
  ];

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    history.push({ role: "user", content: text });
    inputEl.value = '';
    showTyping();

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: history
        })
      });

      const data = await response.json();
      hideTyping();

      if (data.choices && data.choices[0]) {
        const reply = data.choices[0].message.content;
        addMessage(reply, 'ai');
        history.push({ role: "assistant", content: reply });
      } else {
        addMessage("Xatolik: javob olinmadi. Qaytadan urinib ko'ring.", 'ai');
      }
    } catch (err) {
      hideTyping();
      addMessage("Tarmoq xatosi: " + err.message, 'ai');
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  addMessage("Salom! Men AI yordamchiman. Nima haqida gaplashamiz?", 'ai');
</script>

</body>
</html>
